spring:
  ai:
     # 模型一：阿里云 DashScope 原生接口
     dashscope:
       api-key: ${DASHSCOPE_API_KEY}
       # 默认就是这个地址，也可以省略
       base-url: https://dashscope.aliyuncs.com
       chat:
         options:
           model: qwen-plus
       # 不使用 DashScope Embedding 时可关闭
       embedding:
         enabled: false

     # 模型二：你自己的 OpenAI 兼容 API
     openai:
       api-key: ${CUSTOM_AI_API_KEY}
       # 建议不带末尾 /v1
       base-url: https://nowcoding.ai
       chat:
         completions-path: /v1/chat/completions
         options:
           # 填写你的 API 实际提供的模型标识
           model: gpt-5.6-terra
       # 不使用 OpenAI Embedding 时可关闭
       embedding:
         enabled: false