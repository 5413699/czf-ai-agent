spring:
  ai:
     # 模型一：阿里云 DashScope 原生接口
     dashscope:
       api-key: ${DASHSCOPE_API_KEY}
       # 默认就是这个地址，也可以省略
       base-url: https://dashscope.aliyuncs.com
       chat:
         options:
           model: qwen-plus
       # 不使用 DashScope Embedding 时可关闭
       embedding:
         enabled: true
         options:
           model: text-embedding-v1

     # 模型二：你自己的 OpenAI 兼容 API
     openai:
       api-key: ${CUSTOM_AI_API_KEY}
       # 建议不带末尾 /v1
       base-url: https://nowcoding.ai
       chat:
         completions-path: /v1/chat/completions
         options:
           # 填写你的 API 实际提供的模型标识
           model: gpt-5.6-terra
       # 不使用 OpenAI Embedding 时可关闭
       embedding:
         enabled: false

     # 阿里云pgvector配置
     vectorstore:
       pgvector:
         index-type: HNSW
         dimensions: 1536
         distance-type: COSINE_DISTANCE
         max-document-batch-size: 10000 # Optional: Maximum number of documents per batch


  datasource:
    url: jdbc:postgresql://pgm-bp1d38c10i6kdb1bbo.rwlb.rds.aliyuncs.com/czf_ai_agent
    username: 5413699
    password: ${CUSTOM_SECRET}

  flyway:
    baseline-on-migrate: true
    baseline-version: 1


# 百炼知识库
ai:
  rag:
    cloud:
      enabled: true
      index-name: public-author-info
      dense-similarity-top-k: 4
      sparse-similarity-top-k: 4
      enable-rewrite: false
      enable-reranking: false
      rerank-top-n: 3
    local:
      import-enabled: true